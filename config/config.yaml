# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件（糖尿病英文监控版）
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "morning_evening"        # 早晚各推送一次

# ──────────────────────────────────────────────────────────────
# 数据源：关闭国内热榜，只使用国外 RSS
# ──────────────────────────────────────────────────────────────
platforms:
  enabled: false                    # ❌ 关闭国内热榜（避免中文无关内容）

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1                 # 只推送1天内发布的文章
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
    - id: "reddit-diabetes"
      name: "Reddit Diabetes"
      url: "https://www.reddit.com/r/diabetes/.rss"
    - id: "medical-news-diabetes"
      name: "Medical News Today"
      url: "https://www.medicalnewstoday.com/feeds/diabetes"
    - id: "nih-diabetes"
      name: "NIH Diabetes"
      url: "https://www.niddk.nih.gov/health-information/diabetes/rss.xml"

# ──────────────────────────────────────────────────────────────
# 筛选方式：关键词模式（正则匹配英文）
# ──────────────────────────────────────────────────────────────
filter:
  method: "keyword"                 # 使用关键词匹配，不依赖 AI
  priority_sort_enabled: false

report:
  mode: "incremental"               # 只推送新增内容
  display_mode: "keyword"
  rank_threshold: 5
  max_news_per_keyword: 10

# ──────────────────────────────────────────────────────────────
# 推送区域：只显示匹配的热点，不显示 RSS 全部列表
# ──────────────────────────────────────────────────────────────
display:
  region_order:
    - hotlist                       # 只推送命中关键词的新闻
  regions:
    hotlist: true
    new_items: false
    rss: false
    standalone: false
    ai_analysis: false
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0

# ──────────────────────────────────────────────────────────────
# 钉钉推送配置（Webhook 从 GitHub Secrets 读取）
# ──────────────────────────────────────────────────────────────
notification:
  enabled: true
  channels:
    dingtalk:
      webhook_url: "${{ secrets.DINGTALK_WEBHOOK_URL }}"   # 🔐 注意：不要在文件中写真实地址
  # 其他渠道全部留空
  wework: { webhook_url: "" }
  feishu: { webhook_url: "" }
  telegram: { bot_token: "", chat_id: "" }
  email: { from: "", password: "", to: "" }

# ──────────────────────────────────────────────────────────────
# 存储（保持默认）
# ──────────────────────────────────────────────────────────────
storage:
  backend: "auto"
  formats:
    sqlite: true
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0

# ──────────────────────────────────────────────────────────────
# AI 功能全部关闭（不需要）
# ──────────────────────────────────────────────────────────────
ai:
  model: "deepseek/deepseek-chat"
  api_key: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000

ai_analysis:
  enabled: false

ai_translation:
  enabled: false

advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
